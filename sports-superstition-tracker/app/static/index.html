<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Superstition Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    min-height: 100vh;
  }

  /* --- Layout --- */
  .container {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
    min-height: 100vh;
  }
  .main { padding: 24px 32px; }
  .sidebar {
    background: #1a1a1a;
    border-left: 1px solid #2a2a2a;
    padding: 20px;
    overflow-y: auto;
    max-height: 100vh;
    position: sticky;
    top: 0;
  }

  /* --- Join screen --- */
  #join-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    gap: 20px;
  }
  #join-screen h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  #join-screen .subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 12px;
  }
  #join-screen input {
    background: #1a1a1a;
    border: 1px solid #333;
    color: #e0e0e0;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 16px;
    width: 280px;
    outline: none;
  }
  #join-screen input:focus { border-color: #555; }

  .team-pick {
    display: flex;
    gap: 12px;
  }
  .team-btn {
    padding: 12px 32px;
    border-radius: 8px;
    border: 2px solid transparent;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .team-btn.red { background: #3a1515; color: #ff6b6b; border-color: #551a1a; }
  .team-btn.red:hover, .team-btn.red.active { background: #551a1a; border-color: #ff6b6b; }
  .team-btn.blue { background: #151535; color: #6b9bff; border-color: #1a1a55; }
  .team-btn.blue:hover, .team-btn.blue.active { background: #1a1a55; border-color: #6b9bff; }

  .join-go {
    padding: 12px 48px;
    border-radius: 8px;
    border: none;
    background: #e0e0e0;
    color: #111;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .join-go:hover { background: #fff; }

  /* --- Scoreboard --- */
  .scoreboard {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 20px 0 16px;
  }
  .team-score {
    text-align: center;
    min-width: 120px;
  }
  .team-score .name {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .team-score .name.red { color: #ff6b6b; }
  .team-score .name.blue { color: #6b9bff; }
  .team-score .score {
    font-size: 48px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .game-info {
    text-align: center;
    min-width: 80px;
  }
  .game-info .quarter {
    font-size: 13px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .game-info .clock {
    font-size: 24px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }

  /* --- Superstition buttons --- */
  .section-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #666;
    margin: 24px 0 12px;
  }
  .actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .action-btn {
    padding: 16px 12px;
    border-radius: 10px;
    border: 1px solid #2a2a2a;
    background: #1a1a1a;
    color: #ccc;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.12s;
    text-align: center;
    line-height: 1.3;
  }
  .action-btn:hover { background: #252525; border-color: #444; color: #fff; }
  .action-btn:active { transform: scale(0.96); background: #333; }
  .action-btn.clicked {
    background: #1a3a1a;
    border-color: #3a6b3a;
    color: #7bff7b;
  }
  .action-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* --- Start button --- */
  .start-bar {
    text-align: center;
    padding: 16px 0;
  }
  .start-btn {
    padding: 12px 40px;
    border-radius: 8px;
    border: none;
    background: #2a7a2a;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .start-btn:hover { background: #3a9a3a; }
  .start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* --- Leaderboard --- */
  .lb-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #2a2a2a;
  }
  .lb-row {
    display: flex;
    align-items: center;
    padding: 6px 0;
    font-size: 13px;
  }
  .lb-rank {
    width: 24px;
    color: #555;
    font-weight: 600;
  }
  .lb-name {
    flex: 1;
    font-weight: 500;
  }
  .lb-name.red { color: #ff8888; }
  .lb-name.blue { color: #88aaff; }
  .lb-score {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-width: 50px;
    text-align: right;
  }
  .lb-score.positive { color: #7bff7b; }
  .lb-score.negative { color: #ff6b6b; }
  .lb-clicks {
    color: #555;
    font-size: 11px;
    min-width: 40px;
    text-align: right;
  }

  /* --- Action scores --- */
  .action-score-row {
    display: flex;
    align-items: center;
    padding: 5px 0;
    font-size: 13px;
  }
  .action-score-label { flex: 1; color: #aaa; }
  .action-score-val {
    font-weight: 600;
    min-width: 50px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .action-score-val.positive { color: #7bff7b; }
  .action-score-val.negative { color: #ff6b6b; }
  .action-score-count {
    color: #555;
    font-size: 11px;
    min-width: 36px;
    text-align: right;
  }

  /* --- Game feed --- */
  .feed {
    margin-top: 16px;
  }
  .feed-item {
    padding: 5px 0;
    font-size: 12px;
    color: #777;
    border-bottom: 1px solid #1f1f1f;
  }
  .feed-item .team-tag {
    font-weight: 600;
    display: inline-block;
    width: 36px;
  }
  .feed-item .team-tag.red { color: #ff6b6b; }
  .feed-item .team-tag.blue { color: #6b9bff; }

  /* --- Game over overlay --- */
  .game-over-banner {
    text-align: center;
    padding: 20px;
    margin: 16px 0;
    background: #1a1a2a;
    border-radius: 10px;
    border: 1px solid #333;
  }
  .game-over-banner h2 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  .game-over-banner p { color: #888; font-size: 14px; }

  /* --- responsive --- */
  @media (max-width: 768px) {
    .container {
      grid-template-columns: 1fr;
    }
    .sidebar {
      position: static;
      max-height: none;
      border-left: none;
      border-top: 1px solid #2a2a2a;
    }
    .actions { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Main panel -->
  <div class="main">
    <!-- Join screen -->
    <div id="join-screen">
      <h1>Superstition Tracker</h1>
      <p class="subtitle">Do your rituals actually change the game? Let's find out.</p>
      <input type="text" id="name-input" placeholder="Your name" maxlength="20" />
      <div class="team-pick">
        <button class="team-btn red active" onclick="pickTeam('red')">Red Team</button>
        <button class="team-btn blue" onclick="pickTeam('blue')">Blue Team</button>
      </div>
      <button class="join-go" onclick="joinGame()">Join</button>
    </div>

    <!-- Game screen (hidden until joined) -->
    <div id="game-screen" style="display:none">
      <div class="scoreboard">
        <div class="team-score">
          <div class="name red">Red</div>
          <div class="score" id="red-score">0</div>
        </div>
        <div class="game-info">
          <div class="quarter" id="quarter">Q1</div>
          <div class="clock" id="clock">2:00</div>
        </div>
        <div class="team-score">
          <div class="name blue">Blue</div>
          <div class="score" id="blue-score">0</div>
        </div>
      </div>

      <div class="start-bar" id="start-bar">
        <button class="start-btn" id="start-btn" onclick="startGame()">Start Game</button>
      </div>

      <div id="game-over-area"></div>

      <div class="section-label">Your Superstitions</div>
      <div class="actions" id="actions"></div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="lb-title">Magic Power Leaderboard</div>
    <div id="leaderboard"><p style="color:#555;font-size:13px">No players yet</p></div>

    <div class="lb-title" style="margin-top:24px">Best Superstitions</div>
    <div id="action-scores"><p style="color:#555;font-size:13px">No data yet</p></div>

    <div class="lb-title" style="margin-top:24px">Game Feed</div>
    <div class="feed" id="feed"><p style="color:#555;font-size:12px">Waiting for game to start...</p></div>
  </div>
</div>

<script>
const SUPERSTITIONS = [
  {id: "cap",   label: "Turn Cap Around"},
  {id: "beer",  label: "Sip of Beer"},
  {id: "stand", label: "Stand Up"},
  {id: "clap",  label: "Clap 3 Times"},
  {id: "cross", label: "Cross Fingers"},
  {id: "blow",  label: "Blow on Screen"},
];

let ws = null;
let playerId = null;
let selectedTeam = "red";
let gameRunning = false;

// --- Team picker ---
function pickTeam(team) {
  selectedTeam = team;
  document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.team-btn.${team}`).classList.add('active');
}

// --- Join ---
function joinGame() {
  const name = document.getElementById('name-input').value.trim() || 'Anon';
  connect(name, selectedTeam);
}

// --- WebSocket ---
function connect(name, team) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    // Send existing playerId on reconnect so server can restore our session
    const msg = {type: 'register', name, team};
    if (playerId) msg.player_id = playerId;
    ws.send(JSON.stringify(msg));
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);

    if (data.type === 'registered') {
      playerId = data.player_id;
      document.getElementById('join-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      renderActions();
    }

    if (data.red_score !== undefined) updateScoreboard(data);
    if (data.leaderboard) updateLeaderboard(data.leaderboard);
    if (data.actions) updateActionScores(data.actions);
    if (data.events) updateFeed(data.events);

    if (data.type === 'basket') flashBasket(data.team, data.points);
    if (data.type === 'game_over') showGameOver(data);

    gameRunning = data.running || false;
    updateStartBtn(data);
    updateActionBtns();
  };

  ws.onclose = () => {
    setTimeout(() => connect(name, team), 2000);
  };
}

// --- Render action buttons ---
function renderActions() {
  const el = document.getElementById('actions');
  el.innerHTML = SUPERSTITIONS.map(s =>
    `<button class="action-btn" id="btn-${s.id}" onclick="doAction('${s.id}')" disabled>${s.label}</button>`
  ).join('');
}

function updateActionBtns() {
  SUPERSTITIONS.forEach(s => {
    const btn = document.getElementById(`btn-${s.id}`);
    if (btn) btn.disabled = !gameRunning;
  });
}

// --- Send click ---
function doAction(actionId) {
  if (!ws || !playerId || !gameRunning) return;
  ws.send(JSON.stringify({type: 'click', player_id: playerId, action: actionId}));
  const btn = document.getElementById(`btn-${actionId}`);
  btn.classList.add('clicked');
  setTimeout(() => btn.classList.remove('clicked'), 400);
}

// --- Start game ---
async function startGame() {
  document.getElementById('start-btn').disabled = true;
  document.getElementById('game-over-area').innerHTML = '';
  await fetch('/api/start', {method: 'POST'});
}

// --- UI updates ---
function updateScoreboard(d) {
  document.getElementById('red-score').textContent = d.red_score;
  document.getElementById('blue-score').textContent = d.blue_score;
  document.getElementById('quarter').textContent = `Q${d.quarter}`;
  document.getElementById('clock').textContent = d.clock;
}

function updateStartBtn(d) {
  const bar = document.getElementById('start-bar');
  const btn = document.getElementById('start-btn');
  if (d.running) {
    bar.style.display = 'none';
  } else if (d.finished) {
    bar.style.display = 'block';
    btn.textContent = 'New Game';
    btn.disabled = false;
  } else {
    bar.style.display = 'block';
    btn.disabled = false;
  }
}

function updateLeaderboard(players) {
  const el = document.getElementById('leaderboard');
  if (!players.length) { el.innerHTML = '<p style="color:#555;font-size:13px">No players yet</p>'; return; }
  el.innerHTML = players.map((p, i) => {
    const cls = p.score >= 0 ? 'positive' : 'negative';
    return `<div class="lb-row">
      <span class="lb-rank">${i+1}</span>
      <span class="lb-name ${p.team}">${esc(p.name)}</span>
      <span class="lb-score ${cls}">${p.score > 0 ? '+' : ''}${p.score}</span>
      <span class="lb-clicks">${p.clicks}x</span>
    </div>`;
  }).join('');
}

function updateActionScores(actions) {
  const el = document.getElementById('action-scores');
  const labels = Object.fromEntries(SUPERSTITIONS.map(s => [s.id, s.label]));
  el.innerHTML = actions.map(a => {
    const cls = a.score >= 0 ? 'positive' : 'negative';
    return `<div class="action-score-row">
      <span class="action-score-label">${labels[a.id] || a.id}</span>
      <span class="action-score-val ${cls}">${a.score > 0 ? '+' : ''}${a.score}</span>
      <span class="action-score-count">${a.count}x</span>
    </div>`;
  }).join('');
}

function updateFeed(events) {
  const el = document.getElementById('feed');
  if (!events.length) { el.innerHTML = '<p style="color:#555;font-size:12px">Waiting for game to start...</p>'; return; }
  el.innerHTML = events.slice().reverse().map(e =>
    `<div class="feed-item">
      <span class="team-tag ${e.team}">${e.team.toUpperCase()}</span>
      +${e.points} &nbsp; ${e.red}-${e.blue} &nbsp; Q${e.quarter} ${e.clock}
    </div>`
  ).join('');
}

function flashBasket(team, pts) {
  const el = document.getElementById(`${team}-score`);
  el.style.color = team === 'red' ? '#ff4444' : '#4488ff';
  el.style.transform = 'scale(1.2)';
  el.style.transition = 'all 0.15s';
  setTimeout(() => {
    el.style.color = '';
    el.style.transform = '';
  }, 500);
}

function showGameOver(d) {
  const winner = d.red_score > d.blue_score ? 'Red' : d.red_score < d.blue_score ? 'Blue' : 'Tie';
  const topWizard = d.leaderboard && d.leaderboard.length ? d.leaderboard[0].name : 'Nobody';
  document.getElementById('game-over-area').innerHTML = `
    <div class="game-over-banner">
      <h2>Game Over${winner !== 'Tie' ? ` - ${winner} Wins!` : ' - Tied!'}</h2>
      <p>Most magical fan: <strong>${esc(topWizard)}</strong></p>
    </div>`;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>

</body>
</html>
